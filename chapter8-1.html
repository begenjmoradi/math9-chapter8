    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcgI87HU8z5UcZdgqrjvMaNg66SW5HdNPq8tyXpmkxMNXpK_ulh85Lm5BHhKI56522oA/exec';
        const slides = [
            { id: 0, title: '🧊 حجم‌های هندسی و غیرهندسی', body: `<p>حجم‌ها را به <span class="highlight">دو دسته</span> تقسیم می‌کنیم:</p><ul><li><span class="highlight">حجم‌های هندسی:</span> شکل مشخص و تعریف‌شده دارند</li><li><span class="highlight-red">حجم‌های غیرهندسی:</span> شکل مشخص ندارند</li></ul><div class="box"><strong>مثال:</strong><br><span class="highlight">هندسی:</span> مکعب، استوانه، کره<br><span class="highlight-red">غیرهندسی:</span> سنگ، سیب‌زمینی، تکه‌چوب</div>`, shapeType: 'mixed' },
            { id: 1, title: '📊 سه دسته‌بندی حجم‌های هندسی', body: `<p>حجم‌های هندسی به <span class="highlight">سه دسته</span> تقسیم می‌شوند:</p><table><tr><th>دسته</th><th>مثال</th></tr><tr><td><span class="highlight">منشوری</span></td><td>استوانه</td></tr><tr><td><span class="highlight-red">کروی</span></td><td>کره</td></tr><tr><td><span class="highlight-blue">هرمی</span></td><td>مخروط</td></tr></table><div class="box"><strong>نکته:</strong> در این فصل با <span class="highlight">همه انواع حجم‌ها</span> آشنا می‌شویم.</div>`, shapeType: 'categories' },
            { id: 2, title: '📐 قاعده و وجه جانبی', body: `<p><span class="highlight">قاعده:</span> سطح صاف و مسطحی که جسم روی آن قرار می‌گیرد.</p><p>در منشور <span class="highlight">دو قاعده مساوی و موازی</span> داریم.</p><p><span class="highlight-blue">وجه‌های جانبی:</span> سطوح اطراف منشور.</p><div class="box-red"><span class="highlight-red">🔴 قاعده‌ها</span> — با رنگ قرمز</div><div class="box-blue"><span class="highlight-blue">🔵 وجه‌های جانبی</span> — با رنگ آبی</div>`, shapeType: 'bases' },
            { id: 3, title: '🔺 یال و رأس', body: `<p><span class="highlight">یال:</span> محل برخورد <span class="highlight">دو سطح</span></p><p><span class="highlight-red">رأس:</span> محل برخورد <span class="highlight-red">سه سطح</span></p><div class="box"><strong>در مکعب (منشور چهارپهلو):</strong><br>تعداد یال‌ها: <span class="highlight">۱۲</span> &nbsp;|&nbsp; تعداد رأس‌ها: <span class="highlight-red">۸</span></div>`, shapeType: 'edges' },
            { id: 4, title: '📊 فرمول‌های شمارش در منشور n پهلو', body: `<p>در یک منشور، تعداد اجزا به <span class="highlight">تعداد اضلاع قاعده (n)</span> بستگی دارد.</p><div class="box"><span class="highlight">🔹 وجه‌های جانبی:</span> برابر با <span class="highlight">n</span></div><div class="box-red"><span class="highlight-red">🔹 رأس‌ها:</span> برابر با <span class="highlight-red">۲n</span></div><div class="box-blue"><span class="highlight-blue">🔹 یال‌ها:</span> برابر با <span class="highlight-blue">۳n</span></div><div class="example-box"><strong>📝 مثال:</strong> منشور ۵ پهلو<br>وجه‌های جانبی: ۵ &nbsp;|&nbsp; رأس‌ها: ۱۰ &nbsp;|&nbsp; یال‌ها: ۱۵</div><div class="formula">n = 2n = 3n</div>`, shapeType: 'formula' }
        ];
        const examQuestions = [
            { id: 0, text: 'کدام یک <span class="highlight-red">حجم غیرهندسی</span> است؟', options: ['مکعب', 'کره', 'سنگ', 'استوانه'], correct: 2, explanation: 'سنگ یک حجم غیرهندسی است چون شکل مشخص و منظمی ندارد.' },
            { id: 1, text: 'منشور چهارپهلو چند <span class="highlight">وجه جانبی</span> دارد؟', options: ['۲', '۴', '۶', '۸'], correct: 1, explanation: 'منشور چهارپهلو (مکعب) دارای ۴ وجه جانبی است.' },
            { id: 2, text: 'منشور ۶ پهلو چند <span class="highlight-red">رأس</span> دارد؟', options: ['۶', '۹', '۱۲', '۱۸'], correct: 2, explanation: 'تعداد رأس‌ها = ۲ × ۶ = ۱۲ رأس.' },
            { id: 3, text: 'کدام گزینه درباره <span class="highlight">منشور</span> درست است؟', options: ['یک قاعده دارد', 'دو قاعده مساوی و موازی دارد', 'قاعده ندارد', 'قاعده همیشه مثلث است'], correct: 1, explanation: 'منشور همیشه دو قاعده مساوی و موازی دارد.' },
            { id: 4, text: 'منشور ۷ پهلو چند <span class="highlight">یال</span> دارد؟', options: ['۷', '۱۴', '۲۱', '۲۸'], correct: 2, explanation: 'تعداد یال‌ها = ۳ × ۷ = ۲۱ یال.' }
        ];
        let currentSlide = 0, currentExamIndex = 0, examSubmitted = false, examLocked = false, userAnswers = {}, timerInterval = null, timeLeft = 300;
        let scene, camera, renderer, controls, currentGroup = null, animationId = null;

        function initThree() {
            const container = document.getElementById('three-container');
            const rect = container.getBoundingClientRect();
            const width = rect.width || 400, height = rect.height || 300;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
            camera.position.set(4, 3, 6);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.target.set(0, 0, 0);
            controls.update();
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);
            const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
            mainLight.position.set(5, 8, 6);
            mainLight.castShadow = true;
            scene.add(mainLight);
            const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
            fillLight.position.set(-4, 2, 5);
            scene.add(fillLight);
            const backLight = new THREE.DirectionalLight(0x88aaff, 0.2);
            backLight.position.set(-2, 0, -6);
            scene.add(backLight);
            animate();
            new ResizeObserver(() => { const r = container.getBoundingClientRect(); if (r.width > 0 && r.height > 0) { renderer.setSize(r.width, r.height); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); } }).observe(container);
        }
        function animate() { animationId = requestAnimationFrame(animate); if (controls) controls.update(); if (renderer && scene && camera) renderer.render(scene, camera); }

        function createPrism(sides, radius, height, bodyColor, baseColor) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(radius, radius, height, sides, 1, true);
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.3, metalness: 0.05, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);
            const shape = new THREE.Shape();
            const angleStep = (Math.PI * 2) / sides;
            for (let i = 0; i <= sides; i++) { const a = i * angleStep - Math.PI / 2; const x = radius * Math.cos(a); const y = radius * Math.sin(a); i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y); }
            const baseMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.1, metalness: 0.0, transparent: true, opacity: 0.95, side: THREE.DoubleSide, emissive: new THREE.Color(baseColor).multiplyScalar(0.15), emissiveIntensity: 0.2 });
            const baseGeo = new THREE.ShapeGeometry(shape);
            const topBase = new THREE.Mesh(baseGeo, baseMat);
            topBase.rotation.x = -Math.PI / 2;
            topBase.position.y = height / 2;
            group.add(topBase);
            const bottomBase = new THREE.Mesh(baseGeo.clone(), baseMat);
            bottomBase.rotation.x = -Math.PI / 2;
            bottomBase.position.y = -height / 2;
            group.add(bottomBase);
            const fullGeo = new THREE.CylinderGeometry(radius, radius, height, sides, 1, false);
            const edges = new THREE.EdgesGeometry(fullGeo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.5 });
            group.add(new THREE.LineSegments(edges, edgeMat));
            group.position.y = 0;
            group.rotation.x = 0.1;
            group.rotation.y = 0.4;
            return group;
        }
        function createSphere(radius, color) {
            const group = new THREE.Group();
            const geo = new THREE.SphereGeometry(radius, 48, 32);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.85 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            group.add(mesh);
            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.15 });
            group.add(new THREE.LineSegments(edges, edgeMat));
            return group;
        }
        function createCone(sides, radius, height, color) {
            const group = new THREE.Group();
            const geo = new THREE.ConeGeometry(radius, height, sides);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.05, transparent: true, opacity: 0.85, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            group.add(mesh);
            const edges = new THREE.EdgesGeometry(geo);
            const edgeMat = new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.15 });
            group.add(new THREE.LineSegments(edges, edgeMat));
            return group;
        }
        function createMixedShapes() {
            const group = new THREE.Group();
            const cubeGroup = new THREE.Group();
            const cubeGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const cubeMat = new THREE.MeshStandardMaterial({ color: 0x4a6cf7, roughness: 0.3, metalness: 0.05, transparent: true, opacity: 0.85 });
            const cube = new THREE.Mesh(cubeGeo, cubeMat);
            cube.castShadow = true;
            cubeGroup.add(cube);
            cubeGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(cubeGeo), new THREE.LineBasicMaterial({ color: 0xffd700 })));
            cubeGroup.position.set(-1.8, 0, 0);
            group.add(cubeGroup);
            const cylGroup = new THREE.Group();
            const cylGeo = new THREE.CylinderGeometry(0.9, 0.9, 1.8, 32);
            const cylMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.3, metalness: 0.05, transparent: true, opacity: 0.85 });
            const cyl = new THREE.Mesh(cylGeo, cylMat);
            cyl.castShadow = true;
            cylGroup.add(cyl);
            cylGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(cylGeo), new THREE.LineBasicMaterial({ color: 0xffd700 })));
            cylGroup.position.set(1.8, 0, 0);
            group.add(cylGroup);
            const sphereGroup = createSphere(0.9, 0xe84393);
            sphereGroup.position.set(0, 0, 0);
            group.add(sphereGroup);
            return group;
        }
        function createCategories() {
            const group = new THREE.Group();
            const spacing = 2.4;
            const cylGroup = new THREE.Group();
            const cylGeo = new THREE.CylinderGeometry(0.9, 0.9, 1.6, 32);
            const cylMat = new THREE.MeshStandardMaterial({ color: 0x4a6cf7, roughness: 0.3, metalness: 0.05, transparent: true, opacity: 0.85 });
            const cyl = new THREE.Mesh(cylGeo, cylMat);
            cyl.castShadow = true;
            cylGroup.add(cyl);
            cylGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(cylGeo), new THREE.LineBasicMaterial({ color: 0xffd700 })));
            cylGroup.position.set(-spacing, 0, 0);
            group.add(cylGroup);
            const sphereGroup = createSphere(0.9, 0xe84393);
            sphereGroup.position.set(0, 0, 0);
            group.add(sphereGroup);
            const coneGroup = createCone(32, 0.9, 1.8, 0xf39c12);
            coneGroup.position.set(spacing, 0, 0);
            group.add(coneGroup);
            return group;
        }
        function createBasesPrism() { return createPrism(4, 1.6, 2.4, 0x4a6cf7, 0xff6b6b); }
        function createEdgesPrism() { return createPrism(4, 1.6, 2.4, 0x4a6cf7, 0xff6b6b); }
        function createFormulaPrism() { return createPrism(5, 1.6, 2.4, 0x2ecc71, 0xff6b6b); }
        function showShape(type) {
            if (currentGroup) { scene.remove(currentGroup); currentGroup = null; }
            let group;
            switch (type) {
                case 'mixed': group = createMixedShapes(); break;
                case 'categories': group = createCategories(); break;
                case 'bases': group = createBasesPrism(); break;
                case 'edges': group = createEdgesPrism(); break;
                case 'formula': group = createFormulaPrism(); break;
                default: group = createPrism(4, 1.6, 2.4, 0x4a6cf7, 0xff6b6b);
            }
            if (group) { group.scale.set(0.85, 0.85, 0.85); group.position.y = 0; group.rotation.x = 0.15; group.rotation.y = 0.4; scene.add(group); currentGroup = group; camera.position.set(4, 3, 6); controls.target.set(0, 0, 0); controls.update(); }
        }
        function renderSlide(index) {
            const slide = slides[index];
            document.getElementById('slide-title-text').textContent = slide.title;
            document.getElementById('slide-num-text').textContent = `${index + 1} / ${slides.length}`;
            document.getElementById('slide-body').innerHTML = slide.body;
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('slide-counter').textContent = `${index + 1} / ${slides.length}`;
            const nextBtn = document.getElementById('next-btn');
            if (index === slides.length - 1) { nextBtn.textContent = localStorage.getItem('exam_section8_1_done') === 'true' ? '🔁 رفتن به بخش دوم' : '📝 شروع آزمون'; } else { nextBtn.textContent = 'بعدی ←'; }
            showShape(slide.shapeType);
            const content = document.getElementById('slide-content');
            content.classList.remove('fade-in');
            void content.offsetWidth;
            content.classList.add('fade-in');
        }
        function renderExamQuestion(index) {
            const area = document.getElementById('exam-question-area');
            const q = examQuestions[index];
            const letters = ['الف', 'ب', 'ج', 'د'];
            const div = document.createElement('div');
            div.className = 'exam-question';
            div.dataset.qid = q.id;
            const qText = document.createElement('div');
            qText.className = 'q-text';
            qText.innerHTML = `<span class="q-num">${index + 1}.</span> ${q.text}`;
            div.appendChild(qText);
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            q.options.forEach((opt, oi) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `exam_q${q.id}`;
                radio.value = oi;
                radio.dataset.qid = q.id;
                if (userAnswers[q.id] !== undefined && userAnswers[q.id] === oi) { radio.checked = true; label.classList.add('selected'); }
                if (examSubmitted) { radio.disabled = true; label.classList.add('disabled'); if (oi === q.correct) label.classList.add('correct'); else if (userAnswers[q.id] === oi && userAnswers[q.id] !== q.correct) label.classList.add('wrong'); }
                const letterSpan = document.createElement('span');
                letterSpan.className = 'letter';
                letterSpan.textContent = `${letters[oi]})`;
                const textSpan = document.createElement('span');
                textSpan.textContent = opt;
                label.appendChild(radio);
                label.appendChild(letterSpan);
                label.appendChild(textSpan);
                if (!examSubmitted && !examLocked) {
                    label.addEventListener('click', () => {
                        if (examSubmitted || examLocked) return;
                        const parent = label.closest('.exam-question');
                        parent.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                        label.classList.add('selected');
                        radio.checked = true;
                        userAnswers[q.id] = oi;
                        document.getElementById('exam-confirm-btn').disabled = false;
                    });
                }
                optionsDiv.appendChild(label);
            });
            div.appendChild(optionsDiv);
            area.innerHTML = '';
            area.appendChild(div);
            document.getElementById('exam-progress').textContent = `سوال ${index + 1} از ${examQuestions.length}`;
            if (userAnswers[q.id] !== undefined && !examSubmitted) { document.getElementById('exam-confirm-btn').disabled = false; } else { document.getElementById('exam-confirm-btn').disabled = true; }
            if (examSubmitted) document.getElementById('exam-confirm-btn').disabled = true;
        }
        function showExamResult() {
            const resultDiv = document.getElementById('exam-result');
            const scoreSpan = document.getElementById('exam-score');
            const msgSpan = document.getElementById('exam-msg');
            let correctCount = 0;
            examQuestions.forEach(q => { if (userAnswers[q.id] === q.correct) correctCount++; });
            scoreSpan.textContent = `${correctCount} از ${examQuestions.length}`;
            msgSpan.textContent = correctCount === examQuestions.length ? '🎉 عالی! همه پاسخ‌ها درست بود!' : `✅ شما ${correctCount} پاسخ درست دادید.`;
            msgSpan.style.color = correctCount >= 3 ? '#00ff88' : '#ffd700';
            resultDiv.classList.add('show');
            document.getElementById('exam-confirm-btn').disabled = true;
            document.querySelectorAll('.option-label input[type="radio"]').forEach(r => r.disabled = true);
            document.querySelectorAll('.option-label').forEach(l => l.classList.add('disabled'));
        }
        function showModal(icon, title, desc, btnText, isLastQuestion, callback) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('modal-icon').textContent = icon;
            const titleEl = document.getElementById('modal-title');
            titleEl.textContent = title;
            titleEl.className = 'title ' + (icon === '✅' ? 'correct' : 'wrong');
            document.getElementById('modal-desc').textContent = desc;
            const btn = document.getElementById('modal-next-btn');
            btn.textContent = isLastQuestion ? 'پایان آزمون' : 'سوال بعدی';
            btn.onclick = () => { modal.classList.remove('show'); if (callback) callback(); };
            modal.classList.add('show');
        }
        function confirmAnswer() {
            if (examSubmitted || examLocked) return;
            const currentQ = examQuestions[currentExamIndex];
            const selected = userAnswers[currentQ.id];
            if (selected === undefined) { showModal('⚠️', 'لطفاً یک گزینه انتخاب کنید!', 'برای تایید پاسخ، ابتدا یکی از گزینه‌ها را انتخاب کنید.', 'باشه', false, () => {}); return; }
            const isCorrect = selected === currentQ.correct;
            const icon = isCorrect ? '✅' : '❌';
            const title = isCorrect ? 'پاسخ درست! 🎉' : 'پاسخ نادرست! 😞';
            const desc = currentQ.explanation;
            const isLast = currentExamIndex === examQuestions.length - 1;
            document.getElementById('exam-confirm-btn').disabled = true;
            showModal(icon, title, desc, isLast ? 'پایان آزمون' : 'سوال بعدی', isLast, () => { if (isLast) { finishExam(); } else { currentExamIndex++; renderExamQuestion(currentExamIndex); document.getElementById('exam-confirm-btn').disabled = true; } });
        }
        async function finishExam() {
            if (examSubmitted || examLocked) return;
            examLocked = true; examSubmitted = true;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            let correctCount = 0;
            examQuestions.forEach(q => { if (userAnswers[q.id] === q.correct) correctCount++; });
            const userId = localStorage.getItem('math9_userId');
            const name = localStorage.getItem('math9_name') || 'نامشخص';
            const cls = localStorage.getItem('math9_class') || 'نامشخص';
            if (userId) {
                try { const payload = { action: 'saveResult', userId, name, class: cls, chapter: 1, correct: correctCount, total: examQuestions.length, percent: Math.round((correctCount / examQuestions.length) * 100) }; await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }); } catch (error) { console.error('❌ خطا در ارسال درخواست:', error); }
            }
            localStorage.setItem('exam_section8_1_done', 'true');
            document.getElementById('exam-question-area').innerHTML = '';
            showExamResult();
            document.getElementById('exam-confirm-btn').disabled = true;
            document.getElementById('exam-timer').textContent = '⏱️ پایان';
            document.getElementById('goto-section2-btn').style.display = 'inline-block';
            examLocked = false;
        }
        function startTimer() {
            timeLeft = 300;
            const timerEl = document.getElementById('exam-timer');
            timerInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerEl.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (timeLeft <= 60) timerEl.classList.add('warning');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerEl.textContent = '⏱️ زمان تمام شد!';
                    if (!examSubmitted) {
                        examSubmitted = true; examLocked = true;
                        let correctCount = 0;
                        examQuestions.forEach(q => { if (userAnswers[q.id] === q.correct) correctCount++; });
                        const userId = localStorage.getItem('math9_userId');
                        const name = localStorage.getItem('math9_name') || 'نامشخص';
                        const cls = localStorage.getItem('math9_class') || 'نامشخص';
                        if (userId) {
                            const payload = { action: 'saveResult', userId, name, class: cls, chapter: 1, correct: correctCount, total: examQuestions.length, percent: Math.round((correctCount / examQuestions.length) * 100) };
                            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(() => {});
                        }
                        localStorage.setItem('exam_section8_1_done', 'true');
                        showExamResult();
                        document.getElementById('exam-confirm-btn').disabled = true;
                        document.getElementById('goto-section2-btn').style.display = 'inline-block';
                        examLocked = false;
                    }
                }
            }, 1000);
        }
        function startExam() {
            try {
                if (localStorage.getItem('exam_section8_1_done') === 'true') {
                    if (confirm('✅ شما قبلاً در این آزمون شرکت کرده‌اید. آیا می‌خواهید به بخش دوم بروید؟')) { window.location.href = 'chapter8-2.html'; }
                    return;
                }
                const examScreen = document.getElementById('exam-screen');
                examScreen.classList.add('show');
                document.getElementById('slide-content').style.display = 'none';
                document.getElementById('nav-buttons').style.display = 'none';
                if (currentGroup) { scene.remove(currentGroup); currentGroup = null; }
                currentExamIndex = 0;
                userAnswers = {};
                examSubmitted = false;
                examLocked = false;
                document.getElementById('exam-result').classList.remove('show');
                document.getElementById('goto-section2-btn').style.display = 'none';
                document.getElementById('exam-timer').classList.remove('warning');
                renderExamQuestion(0);
                if (timerInterval) clearInterval(timerInterval);
                startTimer();
            } catch (error) { console.error('❌ خطا در startExam:', error); alert('خطایی رخ داد. لطفاً دوباره تلاش کنید.'); }
        }
        document.getElementById('prev-btn').addEventListener('click', () => { if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide); } });
        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentSlide === slides.length - 1) {
                if (localStorage.getItem('exam_section8_1_done') === 'true') {
                    if (confirm('✅ شما قبلاً در این آزمون شرکت کرده‌اید. آیا می‌خواهید به بخش دوم بروید؟')) { window.location.href = 'chapter8-2.html'; }
                    return;
                }
                startExam();
                return;
            }
            if (currentSlide < slides.length - 1) { currentSlide++; renderSlide(currentSlide); }
        });
        document.getElementById('close-exam-btn').addEventListener('click', () => {
            if (examSubmitted) {
                if (confirm('آزمون کامل شده است. آیا می‌خواهید به اسلایدها بازگردید؟')) {
                    document.getElementById('exam-screen').classList.remove('show');
                    document.getElementById('slide-content').style.display = 'flex';
                    document.getElementById('nav-buttons').style.display = 'flex';
                    if (timerInterval) clearInterval(timerInterval);
                    renderSlide(currentSlide);
                }
            } else {
                if (confirm('آیا از بازگشت به اسلایدها مطمئن هستید؟ پیشرفت آزمون از دست خواهد رفت.')) {
                    document.getElementById('exam-screen').classList.remove('show');
                    document.getElementById('slide-content').style.display = 'flex';
                    document.getElementById('nav-buttons').style.display = 'flex';
                    if (timerInterval) clearInterval(timerInterval);
                    renderSlide(currentSlide);
                }
            }
        });
        document.getElementById('exam-confirm-btn').addEventListener('click', confirmAnswer);
        document.getElementById('goto-section2-btn').addEventListener('click', () => { window.location.href = 'chapter8-2.html'; });
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('exam-screen').classList.contains('show')) {
                if (e.key === 'Escape') document.getElementById('close-exam-btn').click();
                if (e.key === 'Enter' && !document.getElementById('exam-confirm-btn').disabled) { e.preventDefault(); document.getElementById('exam-confirm-btn').click(); }
                return;
            }
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); document.getElementById('next-btn').click(); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('prev-btn').click(); }
        });
        initThree();
        renderSlide(0);
        console.log('📐 فصل ۸ - بخش اول (مفاهیم پایه)');
    </script>
